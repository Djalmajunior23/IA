name: Check static site
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tests/check-site.py
      - run: node --check assets/js/app.js
      - run: node --check assets/js/assessment.js
      - run: node --check assets/js/etapas.js
